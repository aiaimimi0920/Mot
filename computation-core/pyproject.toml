[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g2a-computation-core"
version = "0.0.1"
description = "G2A V0.0.1 Computation Core SDK and standalone agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
g2a-core = "g2a_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
