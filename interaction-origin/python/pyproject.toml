[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g2a-interaction-origin"
version = "0.0.1"
description = "Zero-dependency G2A V0.0.1 Interaction Origin SDK and 5-genre host simulator for Python 3.11+"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []
keywords = ["g2a", "game-ai", "companion", "npc", "interaction-origin"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aiaimimi0920/Mot"
Repository = "https://github.com/aiaimimi0920/Mot.git"

[project.scripts]
g2a-origin-demo = "g2a_origin.demo_host:main"

[tool.setuptools.package-data]
g2a_origin = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
